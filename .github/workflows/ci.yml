name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc -b

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npx vite build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
